[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bringup-bench"
version = "0.1.0"
description = "Agentic MCU board bring-up — bus traces, clock trees, driver stubs, and Hermes skills"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Bringup Bench Contributors" }]
keywords = [
  "embedded",
  "bring-up",
  "i2c",
  "spi",
  "uart",
  "mcu",
  "hermes",
  "agentic-ai",
  "mcp",
  "firmware",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Embedded Systems",
]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "httpx",
]

[project.urls]
Homepage = "https://amiirhosseini.github.io/bringup-bench/"
Documentation = "https://github.com/Amiirhosseini/bringup-bench#readme"
Repository = "https://github.com/Amiirhosseini/bringup-bench"
Issues = "https://github.com/Amiirhosseini/bringup-bench/issues"

[project.scripts]
bringup = "bringupbench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bringupbench"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
